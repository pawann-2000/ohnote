<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OhNote — Manual import</title>
    <link rel="icon" type="image/png" href="../icons/icon128.png" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="../icons/logo.png" alt="" class="logo" width="32" height="32" />
        <div class="name">OhNote<span class="dot">.</span></div>
      </div>

      <h1>Manual import</h1>
      <p class="lead">
        <strong id="platform">This platform</strong> doesn't accept a direct import URL.
        Copy the notebook URL below, then click <em>Open platform</em> and paste it
        into the import / new-notebook field.
      </p>

      <label class="field">
        <span>Notebook URL</span>
        <div class="copy-row">
          <input id="url" type="text" readonly />
          <button id="copy" type="button">Copy</button>
        </div>
      </label>

      <div class="actions">
        <a id="open" class="primary" target="_blank" rel="noopener noreferrer">Open platform</a>
      </div>

      <p class="status" id="status"></p>
    </main>
    <script type="module" src="manual.js"></script>
  </body>
</html>
